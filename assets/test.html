<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: sans-serif;
  }

  model-viewer {
    width: min(95vw, 1200px);
    height: min(80vh, 800px);

    /* 落ち着いたグリーン系 */
    background: linear-gradient(
      135deg,
      #0b3d2e,
      #14532d,
      #1b4332
    );

    border-radius: 20px;
    overflow: hidden;

    box-shadow:
      0 10px 40px rgba(0,0,0,0.4),
      inset 0 0 20px rgba(255,255,255,0.05);
  }

  model-viewer#reveal {
    --poster-color: transparent;
  }

  /* スマホ最適化 */
  @media (max-width: 768px) {
    model-viewer {
      width: 100vw;
      height: 70vh;
      border-radius: 0;
    }
  }
</style>

<!-- model-viewer -->
<script
  type="module"
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
</script>

<script
  nomodule
  src="https://unpkg.com/@google/model-viewer/dist/model-viewer-legacy.js">
</script>
</head>

<body>

<model-viewer
  id="reveal"
  loading="eager"
  camera-controls
  auto-rotate
  exposure="0.8"
  alt="pancake"
  src="shapr3d_export_2026-05-08_23h38m.glb"
  poster="/shapr3d_export_2026-05-08_23h38m.glb">
</model-viewer>

</body>
</html>
